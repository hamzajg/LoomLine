server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        # $http_host keeps the port — the OIDC redirect_uri must match the
        # public origin (localhost:8086), not the container name.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The OIDC callback sets chunked session cookies — larger than the
        # default 4k header buffer (502 "upstream sent too big header").
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
