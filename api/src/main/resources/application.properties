quarkus.application.name=loomline-api
quarkus.http.port=8080

# --- data source -----------------------------------------------------------
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=loomline
%dev.quarkus.datasource.password=loomline
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/loomline
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}

# Tests run against a throwaway PostgreSQL provisioned by Quarkus Dev Services
# (Testcontainers under the hood).
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16

# --- schema ----------------------------------------------------------------
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
%dev.quarkus.flyway.locations=db/migration,db/seed
%test.quarkus.flyway.locations=db/migration,db/seed

# --- http ------------------------------------------------------------------
quarkus.http.cors.enabled=true
# Vite dev server (5173) and the Compose web container (8086). Override with
# CORS_ORIGINS in deployments that serve the UI from another origin.
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8086}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,content-type,origin,x-requested-with
quarkus.shutdown.timeout=10s
