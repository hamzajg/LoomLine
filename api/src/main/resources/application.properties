quarkus.application.name=loomline-api
quarkus.http.port=8080

# --- data source -----------------------------------------------------------
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=loomline
%dev.quarkus.datasource.password=loomline
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/loomline
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}

# Tests run against a throwaway PostgreSQL provisioned by Quarkus Dev Services
# (Testcontainers under the hood).
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16

# --- schema ----------------------------------------------------------------
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
%dev.quarkus.flyway.locations=db/migration,db/seed
%test.quarkus.flyway.locations=db/migration,db/seed

# --- http ------------------------------------------------------------------
quarkus.http.cors.enabled=true
# Vite dev server (5173) and the Compose web container (8086). Override with
# CORS_ORIGINS in deployments that serve the UI from another origin.
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8086}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,content-type,origin,x-requested-with
quarkus.shutdown.timeout=10s

# --- identity (OIDC / Keycloak, authorization code flow) -------------------
# ADR-0002-identity.md: the browser holds only an HttpOnly session cookie; the
# OIDC tokens stay server-side. Endpoints are declared explicitly (discovery
# disabled) so the API reaches Keycloak on the container network while the
# browser is sent to the published address. Override the OIDC_* variables per
# environment; the defaults target the local Compose demo (Keycloak on :8087).
quarkus.oidc.application-type=web-app
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8087/realms/loomline}
quarkus.oidc.discovery-enabled=false
quarkus.oidc.client-id=${OIDC_CLIENT_ID:loomline-app}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:loomline-demo-secret}
quarkus.oidc.authorization-path=${OIDC_AUTHORIZATION_PATH:http://localhost:8087/realms/loomline/protocol/openid-connect/auth}
quarkus.oidc.token-path=/protocol/openid-connect/token
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.end-session-path=${OIDC_END_SESSION_PATH:http://localhost:8087/realms/loomline/protocol/openid-connect/logout}
quarkus.oidc.token.issuer=${OIDC_ISSUER:http://localhost:8087/realms/loomline}
quarkus.oidc.authentication.redirect-path=/api/auth/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
# XHR/JSON callers get 401 instead of a redirect so the SPA can react.
quarkus.oidc.authentication.java-script-auto-redirect=true
quarkus.oidc.logout.path=/api/auth/logout
quarkus.oidc.logout.post-logout-path=/
# Keycloak carries realm roles under realm_access.roles in the access token.
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-paths=realm_access.roles

# --- access administration (US7) -------------------------------------------
# The admin console delegates user/role lifecycle to the Keycloak Admin API.
# Defaults match the local Compose demo; deployments override via env.
loomline.keycloak.admin-url=${KEYCLOAK_ADMIN_URL:http://localhost:8087}
loomline.keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:admin}
loomline.keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:admin}
loomline.keycloak.realm=${KEYCLOAK_REALM:loomline}

# --- authorization: everything under /api and /q needs a session ------------
quarkus.http.auth.permission.public.paths=/q/health,/q/health/*,/q/openapi,/q/openapi/*,/api/auth/callback,/api/auth/logout
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.api.paths=/api/*,/q/*
quarkus.http.auth.permission.api.policy=authenticated

# Tests exercise the HTTP permission layer, not the provider, so the OIDC
# tenant is turned off: no provider is contacted and the anonymous-caller
# behaviour (401 on /api/**, open health) can be asserted hermetically.
%test.quarkus.oidc.tenant-enabled=false
# 8081 is the Quarkus test default but collides with other local stacks;
# pin a dedicated port so `gradlew test` is hermetic.
%test.quarkus.http.test-port=8181
