name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (Quarkus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build compiles for a Java 25 toolchain; Gradle itself also runs on it.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # Tests provision PostgreSQL through Quarkus Dev Services, using the
      # Docker daemon available on the runner.
      - name: Test
        run: ./gradlew :api:test --no-daemon

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
